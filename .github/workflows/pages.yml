name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Never publish a build whose calibration check is failing.
      - name: Test
        run: npm test

      # Stage only what the site needs. Uploading '.' would ship .git,
      # node_modules and the Python reference alongside the site.
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src data docs _site/
          touch _site/.nojekyll

          # Stamp every asset URL with the commit SHA. Without this, browsers keep
          # serving the previous src/ui.js and data/cards.json after a deploy —
          # you get the new index.html with the old code behind it.
          BUILD="${GITHUB_SHA::7}"
          sed -i "s/?v=dev/?v=$BUILD/g" _site/index.html _site/src/ui.js
          sed -i "s/const APP_VERSION = 'dev';/const APP_VERSION = '$BUILD';/" _site/src/ui.js
          echo "Stamped build $BUILD"
          grep -o "?v=[a-z0-9]*" _site/index.html

      # enablement: true turns Pages on via the API if it isn't already, instead of
      # failing with "Get Pages site failed ... Not Found". Needs the repo-level
      # pages: write permission granted above.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
