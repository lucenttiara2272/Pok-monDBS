name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Never publish a build whose calibration check is failing.
      - name: Test
        run: npm test

      # Stage only what the site needs. Uploading '.' would ship .git,
      # node_modules and the Python reference alongside the site.
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src data docs _site/
          touch _site/.nojekyll

      # enablement: true turns Pages on via the API if it isn't already, instead of
      # failing with "Get Pages site failed ... Not Found". Needs the repo-level
      # pages: write permission granted above.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
